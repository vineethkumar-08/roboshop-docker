services:
  catalogue:
    build:
      context: ./catalogue
      dockerfile: dockerfile
    image: vineethk08//catalogue:1.0.0
    container_name: catalogue
    depends_on:
      - mongodb
  user:
    build: 
      context: ./user
      dockerfile: dockerfile
    image: vineethk08//user:1.0.0
    container_name: user
    depends_on:  
    - redis
    - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: vineethk08//frontend:1.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment

  cart:
    build:
      context: ./cart
      dockerfile: dockerfile
    image: vineethk08//cart:1.0.0
    container_name: cart
    depends_on:
    - redis
    - catalogue

  shipping:
    build: ./shipping
    image: vineethk08//shipping:1.0.0
    container_name: shipping
    depends_on: 
    - mysql
    - cart

  payment:
    build: ./payment
    image: vineethk08//payment:1.0.0
    container_name: payment
    environment:
     CART_HOST: "cart"
     CART_PORT: "8080"
     USER_HOST: "user"
     USER_PORT: "8080"
     AMQP_HOST: "rabbitmq"
     AMQP_USER: "vineethk08/"
     AMQP_PASS: "vineethk08/123"
    depends_on: 
    - user
    - cart 
    - rabbitmq
  

  mongodb:
    build:
      context: ./mongodb
      dockerfile: dockerfile
    image: vineethk08//mongodb:1.0.0
    container_name: mongodb

  mysql:
    build: ./mysql
    image: vineethk08/sql:1.0.0
    container_name: mysql
 

  redis:
    image: redis:7.0
    container_name: redis

  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: vineethk08/
      RABBITMQ_DEFAULT_PASS: vineethk08/123
    container_name: rabbitmq

networks:
  default:
    driver: bridge
    name: vineethk08/
    external: false # if true, you need to create network manually