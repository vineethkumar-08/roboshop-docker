services:
  catalogue:
    build:
      context: ./catalogue
      dockerfile: dockerfile
    image: roboshop/catalogue:1.0.0
    container_name: catalogue
    depends_on:
      - mongodb
  user:
    build: 
      context: ./user
      dockerfile: dockerfile
    image: roboshop/user:1.0.0
    container_name: user:1.0.0
    depends_on: redis

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: roboshop/frontend:1.0.0
    container_name: frontend:1.0.0

  cart:
    build:
      context: ./cart
      dockerfile: dockerfile
    image: roboshop/cart:1.0.0
    container_name: cart:1.0.0
  

  mongodb:
    build:
      context: ./mongodb
      dockerfile: dockerfile
    image: roboshop/mongodb:1.0.0
    container_name: mongodb

  redis:
    image: roboshop/redis:7.0
    container_name: redis:1.0.0

networks:
  default:
    driver: bridge
    name: roboshop
    external: false # if true, you need to create network manually