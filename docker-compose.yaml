services:
  catalogue:
    build:
      dockerfile: catalogue.dockerfile
    image: catalogue:1.0.0
    container_name: catalogue
    depends_on: 
    - mongodb
  mongodb:
    build: 
      dockerfile: mongodb.dockerfile #it moves to mongodb directory
    image: mongodb:1.0.0 # docker build -t joindevopsmongodb:1.0.0
    container_name: mongodb

networks:
  default: 
    driver: bridge
    name: roboshop
    external: false # if true we have to create network manually
